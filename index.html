<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSBPaint</title>
  <link rel="stylesheet" href="/src/styles/reset.css" />
  <link rel="stylesheet" href="/src/styles/layout.css" />
  <link rel="stylesheet" href="/src/styles/toolbar.css" />
  <link rel="stylesheet" href="/src/styles/canvas.css" />
  <link rel="stylesheet" href="/src/styles/colour-palette.css" />
  <link rel="stylesheet" href="/src/styles/status-bar.css" />
</head>
<body>
  <div id="app">
    <header class="menu-bar">
      <button class="menu-item" data-menu="file">File</button>
      <button class="menu-item" data-menu="edit">Edit</button>
      <button class="menu-item" data-menu="undo" title="Ctrl+Z">Undo</button>
      <button class="menu-item" data-menu="redo" title="Ctrl+Shift+Z">Redo</button>
      <div class="menu-group">
        <button class="menu-item" data-menu="view">View</button>
        <div class="menu-dropdown" id="view-menu" hidden>
          <button class="menu-dropdown-item" data-action="zoom-in">Zoom In</button>
          <button class="menu-dropdown-item" data-action="zoom-out">Zoom Out</button>
          <button class="menu-dropdown-item" data-action="zoom-reset">Reset Zoom</button>
        </div>
      </div>
      <div class="menu-group">
        <button class="menu-item" data-menu="image">Image</button>
        <div class="menu-dropdown" id="image-menu" hidden>
          <button class="menu-dropdown-item" data-action="attributes">Attributes...</button>
        </div>
      </div>
      <button class="menu-item" data-menu="help">Help</button>
    </header>

    <div class="workspace">
      <aside class="toolbar" id="toolbar"></aside>

      <main class="canvas-area">
        <div class="canvas-wrapper" id="canvas-wrapper">
          <canvas id="paint-canvas"></canvas>
        </div>
        <div class="canvas-resize-handle" id="canvas-resize-handle" title="Drag to resize"></div>
        <div class="canvas-resize-preview" id="canvas-resize-preview"></div>
      </main>
    </div>

    <dialog class="attributes-dialog" id="attributes-dialog">
      <form method="dialog">
        <p class="attributes-title">Attributes</p>
        <label>Width <input type="number" name="width" min="1" max="4096" required /> px</label>
        <label>Height <input type="number" name="height" min="1" max="4096" required /> px</label>
        <div class="attributes-buttons">
          <button value="ok">OK</button>
          <button value="cancel" formnovalidate>Cancel</button>
        </div>
      </form>
    </dialog>

    <footer class="bottom-bar">
      <div class="colour-palette" id="colour-palette"></div>
      <div class="status-bar" id="status-bar">
        <span class="status-coords" id="status-coords"></span>
        <span class="status-dimensions" id="status-dimensions"></span>
        <span class="status-tool" id="status-tool"></span>
        <span class="status-zoom" id="status-zoom"></span>
      </div>
    </footer>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
