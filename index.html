<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSBPaint</title>
  <link rel="stylesheet" href="/src/styles/reset.css" />
  <link rel="stylesheet" href="/src/styles/layout.css" />
  <link rel="stylesheet" href="/src/styles/toolbar.css" />
  <link rel="stylesheet" href="/src/styles/canvas.css" />
  <link rel="stylesheet" href="/src/styles/colour-palette.css" />
  <link rel="stylesheet" href="/src/styles/status-bar.css" />
  <link rel="stylesheet" href="/src/styles/menu-dropdown.css" />
</head>
<body>
  <div id="app">
    <header class="menu-bar">
      <div class="menu-group">
        <button class="menu-item" data-menu="file" aria-haspopup="true" aria-expanded="false">File</button>
        <div class="menu-dropdown" hidden>
          <button class="menu-dropdown-item" data-action="new">New</button>
          <button class="menu-dropdown-item" data-action="save-png" title="Ctrl+S">Save as PNG</button>
          <button class="menu-dropdown-item" data-action="save-jpeg">Save as JPEG</button>
        </div>
      </div>
      <div class="menu-group">
        <button class="menu-item" data-menu="edit" aria-haspopup="true" aria-expanded="false">Edit</button>
        <div class="menu-dropdown" hidden>
          <button class="menu-dropdown-item" data-action="undo" title="Ctrl+Z">Undo</button>
          <button class="menu-dropdown-item" data-action="redo" title="Ctrl+Shift+Z">Redo</button>
          <button class="menu-dropdown-item" data-action="clear">Clear Canvas</button>
        </div>
      </div>
      <div class="menu-group">
        <button class="menu-item" data-menu="view" aria-haspopup="true" aria-expanded="false">View</button>
        <div class="menu-dropdown" hidden>
          <button class="menu-dropdown-item" data-action="zoom-in">Zoom In</button>
          <button class="menu-dropdown-item" data-action="zoom-out">Zoom Out</button>
          <button class="menu-dropdown-item" data-action="zoom-reset">Reset Zoom</button>
        </div>
      </div>
      <div class="menu-group">
        <button class="menu-item" data-menu="help" aria-haspopup="true" aria-expanded="false">Help</button>
        <div class="menu-dropdown" hidden>
          <button class="menu-dropdown-item" data-action="about">About</button>
        </div>
      </div>
    </header>

    <div class="workspace">
      <aside class="toolbar" id="toolbar"></aside>

      <main class="canvas-area">
        <div class="canvas-wrapper" id="canvas-wrapper">
          <canvas id="paint-canvas"></canvas>
        </div>
      </main>
    </div>

    <footer class="bottom-bar">
      <div class="colour-palette" id="colour-palette"></div>
      <div class="status-bar" id="status-bar">
        <span class="status-coords" id="status-coords"></span>
        <span class="status-dimensions" id="status-dimensions"></span>
        <span class="status-tool" id="status-tool"></span>
        <span class="status-zoom" id="status-zoom"></span>
      </div>
    </footer>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
